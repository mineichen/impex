[package]
name = "impex-derive"
version = "0.1.0"
edition = "2024"
description = "Procedural macro crate for impex"
license = "MIT"
repository = "https://github.com/mineichen/impex"
readme = false

[lib]
proc-macro = true

[features]
visitor = []

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
